name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build (Ubuntu 24.04) and test
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write   # draft release on tags
    env:
      EXODUS_CACHE: ${{ github.workspace }}/__exodus_cache
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ python3-venv dpkg-dev valgrind patchelf

      - name: Restore pinned .deb cache
        id: debcache
        uses: actions/cache/restore@v4
        with:
          path: __exodus_cache/apt
          key: apt-${{ hashFiles('exodus.json', 'exodus2.json', 'exodus-test.json') }}
          restore-keys: apt-

      - name: Install Exodus
        run: |
          python3 -m venv "$RUNNER_TEMP/exvenv"
          "$RUNNER_TEMP/exvenv/bin/pip" install -q "git+https://github.com/Pymann/exodus.git"
          echo "$RUNNER_TEMP/exvenv/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned dependencies
        run: |
          python3 tools/ci/fetch_pinned_debs.py exodus.json exodus2.json exodus-test.json

      - name: Save pinned .deb cache
        if: steps.debcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: __exodus_cache/apt
          key: ${{ steps.debcache.outputs.cache-primary-key }}

      - name: Exodus package setup
        run: exodus pkg install

      - name: Build compiler
        run: exodus build -c exodus.json -j "$(nproc)"

      - name: Build runtime
        run: exodus build -c exodus2.json -j "$(nproc)"

      - name: Smoke test
        run: |
          set +e
          out/aiml/aiml tests/test.aiml
          rc=$?
          echo "exit code $rc"
          test "$rc" -eq 42   # tests/test.aiml ends in sys.exit(42)

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME}"; else v="git-${GITHUB_SHA::7}"; fi
          bash tools/ci/package_release.sh "$v" dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aiml-linux-x86_64
          path: dist/*

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --verify-tag --title "$tag" --notes-from-tag
          fi

      - name: Test corpus
        id: corpus
        continue-on-error: true
        run: |
          TEST_TIMEOUT=300 bash run_all_tests.sh --no-build > corpus.log 2>&1 || true
          tail -n 8 test_results.txt
          {
            echo "## Test corpus"
            echo '```'
            tail -n 8 test_results.txt
            echo '```'
            echo "### Failures"
            echo '```'
            grep -E '^\[ FAIL \]' test_results.txt || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ! grep -qE '^\[ FAIL \]' test_results.txt

      - name: Lifetime suite (spec/61)
        continue-on-error: true
        run: bash tests/lifetime/run_lifetime.sh 2>&1 | tail -n 40

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_results.txt
            corpus.log
          if-no-files-found: ignore
