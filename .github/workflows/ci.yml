name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "run_all_tests.sh --only <pattern> (empty = whole corpus)"
        required: false
        default: ""
      diagnose:
        description: "Space-separated .aiml tests to run with --log-level INFO right after the smoke test"
        required: false
        default: ""
      release_tag:
        description: "Create this tag on the built commit and draft a release (e.g. v1.0.2.4)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build (Ubuntu 24.04) and test
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write   # draft release on tags
    env:
      EXODUS_CACHE: ${{ github.workspace }}/__exodus_cache
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ python3-venv dpkg-dev valgrind patchelf \
            xvfb x11-utils libgl1-mesa-dri
          # xvfb + x11-utils: run_all_tests.sh asks xdpyinfo whether the display
          # is real before it runs a display test.  libgl1-mesa-dri gives that
          # display a software GL, without which the GL tests cannot run at all.

      - name: Restore pinned .deb cache
        id: debcache
        uses: actions/cache/restore@v4
        with:
          path: __exodus_cache/apt
          key: apt-${{ hashFiles('exodus.json', 'exodus2.json', 'exodus-test.json', 'exodus-zim.json', 'exodus-wasm-runtime.json') }}
          restore-keys: apt-

      - name: Install Exodus
        run: |
          python3 -m venv "$RUNNER_TEMP/exvenv"
          "$RUNNER_TEMP/exvenv/bin/pip" install -q "git+https://github.com/Pymann/exodus.git"
          echo "$RUNNER_TEMP/exvenv/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned dependencies
        run: |
          python3 tools/ci/fetch_pinned_debs.py exodus.json exodus2.json exodus-test.json exodus-zim.json exodus-wasm-runtime.json

      - name: Save pinned .deb cache
        if: steps.debcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: __exodus_cache/apt
          key: ${{ steps.debcache.outputs.cache-primary-key }}

      - name: Exodus package setup
        run: exodus pkg install

      - name: Build compiler
        run: exodus build -c exodus.json -j "$(nproc)"

      - name: Build runtime
        run: exodus build -c exodus2.json -j "$(nproc)"

      - name: Build ZIM support (libaiml_zim.so)
        run: exodus build -c exodus-zim.json -j "$(nproc)"

      # spec/68 §8: the release carries the wasm32 runtime.  emsdk and
      # yaml-cpp are git packages of exodus-wasm-runtime.json only, so its
      # packages are installed from a copy named exodus.json (pkg install
      # reads that name); the cache is the same $EXODUS_CACHE.
      - name: Restore emsdk
        id: emsdkcache
        uses: actions/cache/restore@v4
        with:
          path: __exodus_cache/git
          key: wasm-git-${{ hashFiles('exodus-wasm-runtime.json') }}

      - name: wasm32 packages (emsdk, yaml-cpp)
        if: steps.emsdkcache.outputs.cache-hit != 'true'
        run: |
          d="$RUNNER_TEMP/wasmpkg"; mkdir -p "$d"
          cp exodus-wasm-runtime.json "$d/exodus.json"
          (cd "$d" && exodus pkg install)

      - name: Save emsdk
        if: steps.emsdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: __exodus_cache/git
          key: ${{ steps.emsdkcache.outputs.cache-primary-key }}

      - name: Build wasm32 runtime (libaiml_wasm.a)
        run: exodus build -c exodus-wasm-runtime.json -j "$(nproc)"

      - name: Smoke test
        run: |
          set +e
          for f in out/aiml/aiml out/libaiml/libaiml.so; do
            echo "$f RUNPATH entries: $(readelf -d "$f" | sed -n 's/.*(RUNPATH).*\[\(.*\)\]/\1/p' | tr ':' '\n' | grep -c .), via epoch alias: $(readelf -d "$f" | grep -o '%3a' | wc -l)"
          done
          out/aiml/aiml tests/test.aiml
          rc=$?
          echo "exit code $rc"
          test "$rc" -eq 42   # tests/test.aiml ends in sys.exit(42)

      - name: Diagnose
        if: always() && github.event.inputs.diagnose != ''
        env:
          DIAGNOSE: ${{ github.event.inputs.diagnose }}
          DIAGNOSE_LEVEL: DEBUG
        run: |
          mkdir -p logs
          for f in $DIAGNOSE; do
            echo "::group::$f"
            out/aiml/aiml --log-level "${DIAGNOSE_LEVEL:-INFO}" "$f" 2>&1 | grep -v "no owner" | tail -n 400
            echo "exit ${PIPESTATUS[0]}"
            echo "::endgroup::"
          done

      - name: Test corpus
        id: corpus
        env:
          # Not ONLY: drivers such as tests/closures/run.sh read ONLY as their own
          # filter, would match nothing and report a pass.
          CORPUS_ONLY: ${{ github.event.inputs.only }}
        run: |
          # Display tests need an X display AND an interactive terminal:
          # xvfb-run provides the first, `script` the second.  Without the TTY
          # the suite skips all 41 of them in silence -- which is exactly how
          # test_gl_vfx (a real GL buffer bug) and test_layout_helpers (a test
          # that asserted behaviour it never exercised) stayed broken unnoticed.
          cmd="TEST_TIMEOUT=300 bash run_all_tests.sh --no-build"
          # Quoted: the pattern is an ERE, and `a|b` unquoted is a shell pipe inside `script -c`.
          if [ -n "${CORPUS_ONLY:-}" ]; then cmd="$cmd --only $(printf '%q' "$CORPUS_ONLY")"; fi
          set +e
          xvfb-run -a script -qec "$cmd" /dev/null > corpus.log 2>&1
          rc=$?
          set -e
          # The suite judges itself against the expected-failure register in
          # TEST_SUITES.md and exits with that verdict, so this step gates: an
          # unregistered failure is a regression, and a registered one that
          # starts passing is a finding too.
          tail -n 30 test_results.txt
          {
            echo "## Test corpus"
            echo '```'
            tail -n 30 test_results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Output of failed tests
        if: always()
        run: |
          [ -f test_results.txt ] || exit 0
          python3 - <<'PY'
          import re
          blocks = re.split(r"^-{20,}\n", open("test_results.txt", errors="replace").read(), flags=re.M)
          for b in blocks:
              if "[ FAIL ]" in b:
                  lines = b.splitlines()
                  print("::group::" + next((l for l in lines if "[ FAIL ]" in l), "FAIL"))
                  print("\n".join(lines[-150:]))
                  print("::endgroup::")
          PY

      - name: AOT smoke tests
        run: bash run_aot_tests.sh

      # The two valgrind runners answer different questions and are both gates.
      # Neither ran in CI before, so memory safety and leak counts were checked
      # on one developer machine or not at all.
      - name: Memory safety (valgrind)
        run: bash tests/run_memory_sanitizers.sh

      - name: Leak gate (spec/61 §7, valgrind)
        run: bash tests/run_lifetime_leak_gates.sh

      # The lab, not a gate: its own header says it stays red until the spec/61
      # rewrite lands (TEST_SUITES.md §3).  Reported so the distance is visible.
      - name: Lifetime lab (spec/61, red by design)
        continue-on-error: true
        run: bash tests/lifetime/run_lifetime.sh 2>&1 | tail -n 40

      # Packaging and the draft release come AFTER the gates on purpose.  They
      # used to run before the corpus, so a v* tag drafted a release and
      # uploaded an artifact while the tests had not been asked yet -- the one
      # build whose verification matters most was the one that published first.
      - name: Package
        id: package
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then v="${{ github.event.inputs.release_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME}"; else v="git-${GITHUB_SHA::7}"; fi
          REQUIRE_WASM=1 bash tools/ci/package_release.sh "$v" dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aiml-linux-x86_64
          path: dist/*

      # The same bundle into kontor's GENERIC store, as a venv (bin/ lib/ env) keyed
      # on the COMMIT. Two reasons it is not /exodus/<name>/<version>/package: there
      # name and version must match the manifest, and aiml carries ONE version across
      # all commits, so every build would overwrite the last and a second upload of a
      # version is 409 anyway. Consumers (dc_traincorp, chart) already read exactly
      # this path, so this closes the loop: until now the store was filled by whoever
      # happened to need a commit first.
      #
      # Best effort on purpose: a missing secret or a reader-only token must not fail
      # a build that is otherwise green. The release asset above is the primary
      # artifact; kontor is the cache that saves everyone else the LLVM build.
      - name: Put the bundle into kontor
        if: always() && steps.package.outcome == 'success'
        continue-on-error: true
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
          KONTOR_CA: ${{ secrets.KONTOR_CA }}
        run: |
          set -eu
          if [ -z "${KONTOR_URL:-}" ] || [ -z "${KONTOR_TOKEN:-}" ] || [ -z "${KONTOR_CA:-}" ]; then
            echo "KONTOR_* secrets missing -- nothing stored, the release asset stands."
            exit 0
          fi
          work="$(mktemp -d)"
          printf '%s\n' "$KONTOR_CA" > "$work/ca.crt"
          mkdir -p "$work/venv"
          # The release tarball carries one wrapper directory; the venv layout does
          # not, so it is stripped (aiml spec/68 §1).
          tar -xzf dist/aiml-*-linux-x86_64.tar.gz -C "$work/venv" --strip-components=1
          # The venv marker of spec/68 §3 F68-20, so `. <venv>/env` works and
          # `aiml venv <dir>` accepts the directory as a venv rather than refusing it.
          printf '%s\n' "# aiml venv" > "$work/venv/env"
          test -x "$work/venv/bin/aiml"
          test -f "$work/venv/lib/libaiml.so"
          tar -czf "$work/package.tar.gz" -C "$work/venv" bin lib env
          summe=$(sha256sum "$work/package.tar.gz" | cut -d' ' -f1)
          ziel="$KONTOR_URL/generic/aiml/${GITHUB_SHA}/aiml-x86_64-linux.tar.gz"
          # No `curl -k`: without certificate checking a man in the middle could take
          # the write token.
          curl --silent --show-error --fail-with-body --max-time 1800 \
               --cacert "$work/ca.crt" \
               -H "Authorization: Bearer $KONTOR_TOKEN" \
               -H "X-Checksum-Sha256: $summe" \
               -X PUT -T "$work/package.tar.gz" "$ziel"
          echo "stored: generic/aiml/${GITHUB_SHA}/ ($(stat -c%s "$work/package.tar.gz") B)"
          rm -rf "$work"

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            [[ "$tag" == v* ]] || { echo "release_tag must start with v"; exit 1; }
            # The tag does not exist yet: the release creates it on this commit.
            new=(--target "$GITHUB_SHA" --generate-notes)
          else
            tag="$GITHUB_REF_NAME"
            # The tag message becomes the release text; a lightweight tag has
            # none, so its notes are generated from the commits instead.
            kind=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type)
            if [ "$kind" = tag ]; then new=(--verify-tag --notes-from-tag)
            else new=(--verify-tag --generate-notes); fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --title "$tag" "${new[@]}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_results.txt
            corpus.log
          if-no-files-found: ignore
